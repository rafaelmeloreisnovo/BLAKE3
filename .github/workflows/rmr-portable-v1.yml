name: RMR Portable V1

on:
  push:
    paths:
      - 'rmr/portable/**'
      - 'rmr/PROVENIENCE.md'
      - 'AGENTS.md'
      - '.github/workflows/rmr-portable-v1.yml'
  pull_request:
    paths:
      - 'rmr/portable/**'
      - 'rmr/PROVENIENCE.md'
      - 'AGENTS.md'
      - '.github/workflows/rmr-portable-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    env:
      RMR_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Authorial exact-SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$RMR_SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RMR_SOURCE_SHA"

      - name: Toolchain boundary
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          command -v readelf
          command -v sha256sum

          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lld-18
          fi

          if ! command -v ld.lld >/dev/null 2>&1; then
            if command -v ld.lld-18 >/dev/null 2>&1; then
              sudo ln -sf "$(command -v ld.lld-18)" /usr/local/bin/ld.lld
            else
              echo "RMR_PORTABLE_LLD=TOKEN_VAZIO"
              exit 1
            fi
          fi

          clang --version
          ld.lld --version
          readelf --version | head -n1
          if command -v rustc >/dev/null 2>&1; then rustc --version; fi
          if command -v javac >/dev/null 2>&1; then javac -version; fi
          echo "RMR_PORTABLE_TOOLCHAIN_EDGE=EXTERNAL_EXPLICIT"

      - name: Zero external JavaScript Action gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*uses:[[:space:]]+[^.]' .github/workflows/rmr-portable-v1.yml; then
            echo "RMR_PORTABLE_EXTERNAL_ACTION=FAIL"
            exit 1
          fi
          echo "RMR_PORTABLE_EXTERNAL_ACTIONS=0"

      - name: Source-shape gate
        shell: bash
        run: sh rmr/portable/audit/audit_source_shape.sh

      - name: Host C + BLAKE3 KAT + Java + Rust
        shell: bash
        run: sh rmr/portable/build/build_host_selftest.sh

      - name: Cross-architecture freestanding matrix
        shell: bash
        run: sh rmr/portable/build/build_cross_matrix.sh

      - name: Every-file provenance manifest + final receipt
        shell: bash
        run: |
          set -euo pipefail
          manifest=/tmp/rmr-source-manifest.tsv
          receipt=/tmp/rmr-portable-final-receipt.txt

          sh rmr/portable/tools/build_source_manifest.sh "$manifest" | tee /tmp/rmr-manifest-summary.txt
          test -s "$manifest"

          manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          files="$(awk -F= '$1=="RMR_SOURCE_MANIFEST_FILES"{print $2}' /tmp/rmr-manifest-summary.txt)"
          portable="$(awk -F= '$1=="RMR_SOURCE_MANIFEST_PORTABLE"{print $2}' /tmp/rmr-manifest-summary.txt)"
          upstream_exact="$(awk -F= '$1=="RMR_SOURCE_MANIFEST_UPSTREAM_EXACT"{print $2}' /tmp/rmr-manifest-summary.txt)"
          upstream_divergent="$(awk -F= '$1=="RMR_SOURCE_MANIFEST_UPSTREAM_DIVERGENT"{print $2}' /tmp/rmr-manifest-summary.txt)"
          fork_additions="$(awk -F= '$1=="RMR_SOURCE_MANIFEST_FORK_ADDITIONS"{print $2}' /tmp/rmr-manifest-summary.txt)"
          unresolved_origin="$(awk -F= '$1=="RMR_SOURCE_MANIFEST_UNRESOLVED_ORIGIN"{print $2}' /tmp/rmr-manifest-summary.txt)"
          license_token="$(awk -F= '$1=="RMR_SOURCE_MANIFEST_LICENSE_TOKEN_VAZIO"{print $2}' /tmp/rmr-manifest-summary.txt)"

          cat > "$receipt" <<EOF
          schema=rmr.portable-final-receipt/v1
          source_sha=$RMR_SOURCE_SHA
          run_id=$GITHUB_RUN_ID
          run_number=$GITHUB_RUN_NUMBER
          external_js_actions=0
          source_shape=PASS
          host_semantic_kat=PASS
          cross_arch=PASS
          pt_interp=ABSENT_ALL_SIX
          dt_needed=ABSENT_ALL_SIX
          unexpected_und=0_ALL_SIX
          source_manifest_sha256=$manifest_sha
          source_manifest_files=$files
          portable_files=$portable
          upstream_exact_review_paths=$upstream_exact
          upstream_divergent_review_paths=$upstream_divergent
          fork_addition_review_paths=$fork_additions
          unresolved_origin=$unresolved_origin
          license_token_vazio=$license_token
          upstream_comparison_head=6aab490a26124663329dfd3961b8469f8fdb158b
          upstream_rewritten=false
          EOF

          echo "RMR_SOURCE_MANIFEST_SHA256=$manifest_sha"
          echo "RMR_PORTABLE_FINAL_RECEIPT_BEGIN"
          cat "$receipt"
          echo "RMR_PORTABLE_FINAL_RECEIPT_END"
          echo "RMR_PORTABLE_FINAL_RECEIPT_SHA256=$(sha256sum "$receipt" | awk '{print $1}')"
