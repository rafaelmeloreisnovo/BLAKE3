name: rmr-pure-core-boundary-v1

on:
  push:
    paths:
      - 'rmr/core/base.c'
      - 'rmr/core/base_prime.c'
      - 'rmr/core/pai_base.h'
      - 'rmr/core/validate.c'
      - 'rmr/core/validate_core.c'
      - 'rmr/core/pai_validate_core.h'
      - 'rmr/tools/audit_pure_core_boundaries.sh'
      - '.github/workflows/rmr-pure-core-boundary-v1.yml'
  pull_request:
    paths:
      - 'rmr/core/base.c'
      - 'rmr/core/base_prime.c'
      - 'rmr/core/pai_base.h'
      - 'rmr/core/validate.c'
      - 'rmr/core/validate_core.c'
      - 'rmr/core/pai_validate_core.h'
      - 'rmr/tools/audit_pure_core_boundaries.sh'
      - '.github/workflows/rmr-pure-core-boundary-v1.yml'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit pure core boundaries
        run: sh rmr/tools/audit_pure_core_boundaries.sh
