name: RMR BLAKE3 Reproducibility Gate

on:
  pull_request:
    paths:
      - "c/**"
      - "rmr/**"
      - ".github/workflows/rmr-blake3-repro.yml"
  push:
    branches:
      - master
    paths:
      - "c/**"
      - "rmr/**"
      - ".github/workflows/rmr-blake3-repro.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmr-blake3-repro-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Build RMR and run backend self-test
        run: |
          CC=clang CXX=clang++ ./rmr/tools/build_pai.sh

      - name: Run fork vs pinned official comparison
        env:
          ROUNDS: "3"
          ITERATIONS_MIB: "16"
          RMR_CC: clang
          OFFICIAL_CC: clang
        run: |
          ./rmr/tools/orchestrate_blake3_compare.sh

      - name: Run RMR audit pipeline
        run: |
          ./rmr/tools/run_full_audit.sh

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: rmr-blake3-repro-receipts
          path: |
            rmr/benchmark_framework/output/comparisons/**
            rmr/reports/RMR_ARTIFACTS_SHA256.txt
            rmr/reports/RMR_PIPELINE_REPORT.md
            rmr/reports/RMR_TEST_LOG.txt
          if-no-files-found: error
