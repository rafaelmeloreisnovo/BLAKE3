name: RMR SIMPERF

on:
  pull_request:
    paths:
      - "rmr/benchmark_framework/simperf/**"
      - "rmr/benchmark_framework/core/blake3_size_bench.c"
      - "rmr/CMakeLists.txt"
      - ".github/workflows/rmr-simperf.yml"
  push:
    branches:
      - master
    paths:
      - "rmr/benchmark_framework/simperf/**"
      - "rmr/benchmark_framework/core/blake3_size_bench.c"
      - "rmr/CMakeLists.txt"
      - ".github/workflows/rmr-simperf.yml"

permissions:
  contents: read

concurrency:
  group: rmr-simperf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simperf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SIMPERF Python
        run: |
          python3 -m py_compile             rmr/benchmark_framework/simperf/simperf_model.py             rmr/benchmark_framework/simperf/tests/test_simperf.py
          python3 rmr/benchmark_framework/simperf/tests/test_simperf.py

      - name: Validate five hardware profiles
        run: |
          python3 - <<'PY'
          import json
          p = "rmr/benchmark_framework/simperf/hardware_profiles.json"
          d = json.load(open(p, encoding="utf-8"))
          assert d["_meta"]["claim_allowed"] is False
          assert len(d["profiles"]) == 5
          for profile in d["profiles"]:
              assert profile["clock_ghz"] > 0
              assert profile["vector_bytes"] > 0
              assert 0 < profile["memory_efficiency"] <= 1
              assert 0 < profile["relative_uncertainty"] < 1
          print("RMR_SIMPERF_HARDWARE_PROFILES=5/5")
          PY

      - name: Build size-sweep harness
        run: |
          cmake -S rmr -B build/rmr-simperf -G Ninja             -DRMR_BUILD_TESTS=OFF             -DRMR_BUILD_CRYPTO_RUNTIME=OFF
          cmake --build build/rmr-simperf --target rmr-blake3-size-bench

      - name: Smoke size harness and preserve receipts
        run: |
          mkdir -p build/rmr-simperf/receipts
          build/rmr-simperf/rmr-blake3-size-bench rmr 64 16 \
            | tee build/rmr-simperf/receipts/size-64.txt
          build/rmr-simperf/rmr-blake3-size-bench rmr 1048576 4 \
            | tee build/rmr-simperf/receipts/size-1048576.txt
          cp rmr/benchmark_framework/simperf/hardware_profiles.json \
            build/rmr-simperf/receipts/hardware_profiles.json
          {
            echo "RMR_SIMPERF_CI=PASS"
            echo "profiles=5"
            echo "claim_allowed=false"
            echo "SIMULATION!=PHYSICAL_BENCHMARK"
            echo "git_sha=$GITHUB_SHA"
          } > build/rmr-simperf/receipts/receipt.txt
          sha256sum build/rmr-simperf/receipts/size-*.txt \
            build/rmr-simperf/receipts/hardware_profiles.json \
            build/rmr-simperf/receipts/receipt.txt \
            > build/rmr-simperf/receipts/SHA256SUMS.txt

      - name: Upload SIMPERF receipts
        uses: actions/upload-artifact@v4
        with:
          name: rmr-simperf-receipts
          if-no-files-found: error
          path: build/rmr-simperf/receipts/**
