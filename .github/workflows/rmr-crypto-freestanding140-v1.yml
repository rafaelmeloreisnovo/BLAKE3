name: rmr-crypto-freestanding140-v1

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/config.toml'
      - 'src/**'
      - 'rmr/crypto_freestanding140/**'
      - '.github/workflows/rmr-crypto-freestanding140-v1.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/config.toml'
      - 'src/**'
      - 'rmr/crypto_freestanding140/**'
      - '.github/workflows/rmr-crypto-freestanding140-v1.yml'

permissions:
  contents: read

jobs:
  freestanding140:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Provision LLD
        run: |
          clang --version
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lld
          fi
          ld.lld --version
          readelf --version
      - name: Hosted semantic selftest
        run: sh rmr/crypto_freestanding140/build/build_host_selftest.sh
      - name: Cross-link + source/binary gates
        run: sh rmr/crypto_freestanding140/build/build_cross_matrix.sh

  rust-baremetal-gate:
    runs-on: ubuntu-latest
    env:
      RMR_RUST_TOOLCHAIN: '1.99.0'
      RMR_BAREMETAL_TARGETS: 'thumbv7em-none-eabi armv7a-none-eabi aarch64-unknown-none'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Provision pinned Rust and OS-less targets
        run: |
          rustup toolchain install "$RMR_RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RMR_RUST_TOOLCHAIN" \
            thumbv7em-none-eabi \
            armv7a-none-eabi \
            aarch64-unknown-none
          rustc +"$RMR_RUST_TOOLCHAIN" -Vv
          cargo +"$RMR_RUST_TOOLCHAIN" -V
      - name: Rust freestanding build matrix and negative gates
        run: sh rmr/crypto_freestanding140/build/build_rust_baremetal.sh
