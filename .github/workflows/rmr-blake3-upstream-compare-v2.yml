name: RMR BLAKE3 upstream compare V2

on:
  pull_request:
    paths:
      - "c/**"
      - "rmr/benchmark_framework/core/blake3_size_bench.c"
      - "rmr/benchmark_framework/simperf/analyze_blake3_compare_v2.py"
      - "rmr/tools/orchestrate_blake3_compare_v2.sh"
      - ".github/workflows/rmr-blake3-upstream-compare-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmr-blake3-upstream-compare-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Compare current upstream vs fork core
        env:
          CC: clang
          CXX: clang++
          ROUNDS: "9"
          TARGET_MIB: "128"
          SIZES: "64 256 1024 4096 65536 1048576 16777216"
        run: |
          bash rmr/tools/orchestrate_blake3_compare_v2.sh

      - name: Upload V2 receipts
        uses: actions/upload-artifact@v4
        with:
          name: rmr-blake3-upstream-compare-v2
          path: rmr/benchmark_framework/output/comparisons-v2/**
          if-no-files-found: error
