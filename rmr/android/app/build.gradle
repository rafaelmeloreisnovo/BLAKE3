plugins {
    id 'com.android.application'
}

def sourceSha = System.getenv('RMR_SOURCE_SHA') ?: 'TOKEN_VAZIO'\ndef officialSha = System.getenv('B3_UPSTREAM_SHA') ?: 'TOKEN_VAZIO'

android {
    namespace 'io.rafaelia.rmrhash'
    compileSdk 36

    defaultConfig {
        applicationId 'io.rafaelia.rmrhash'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0-triple-research'
        buildConfigField 'String', 'SOURCE_SHA', '"' + sourceSha + '"'\n        buildConfigField 'String', 'OFFICIAL_SHA', '"' + officialSha + '"'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild { cmake { cFlags '-std=c11 -O2' } }
    }

    buildFeatures { buildConfig true }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    buildTypes {
        debug { minifyEnabled false; shrinkResources false }
        release { minifyEnabled false; shrinkResources false }
    }
}

def generatedNotices = layout.buildDirectory.dir('generated/notice-assets')
tasks.register('copyRmrLicenses', Copy) {
    from(rootProject.file('../../LICENSE_A2'))
    from(rootProject.file('../../LICENSE_A2LLVM'))
    from(rootProject.file('../../LICENSE_CC0'))
    from(rootProject.file('../LICENSE_RMR'))
    from(rootProject.file('../portable/LICENSE_RMR_INDIVIDUAL_RESEARCH_V1.txt'))\n    from(rootProject.file('../../THIRD_PARTY_NOTICES_RAFAELIA.md'))\n    from(rootProject.file('upstream_official/LICENSE_A2')) { rename { 'OFFICIAL_LICENSE_A2' } }\n    from(rootProject.file('upstream_official/LICENSE_A2LLVM')) { rename { 'OFFICIAL_LICENSE_A2LLVM' } }\n    from(rootProject.file('upstream_official/LICENSE_CC0')) { rename { 'OFFICIAL_LICENSE_CC0' } }
    into(generatedNotices)
}
android.sourceSets.main.assets.srcDir(generatedNotices)
tasks.named('preBuild').configure { dependsOn('copyRmrLicenses') }
